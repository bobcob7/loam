version: '3'

# Buf and the codegen plugins are pinned in go.mod's `tool` block and run via
# `go tool ...`, so no global install of THOSE is needed — only the Go
# toolchain. That does NOT cover the `task` CLI itself (go-task, the thing
# interpreting this file): it is a genuine host prerequisite, installed
# separately (e.g. `brew install go-task`, or see
# https://taskfile.dev/installation) — it is intentionally NOT added to
# go.mod's `tool` block, since github.com/go-task/task/v3's own dependency
# graph (terminal UI, cloud-storage SDKs for its remote-Taskfile feature,
# etc.) is large enough that pulling it in would bump dozens of this
# module's unrelated pinned transitive versions just to make `task` itself
# hermetic, which is a worse trade than documenting one extra install step.

tasks:
  default:
    cmds:
      - task: proto:lint

  tools:
    desc: Download the pinned Go tools (buf, protoc-gen-go, protoc-gen-connect-go, moq)
    cmds:
      - go mod download

  generate:
    desc: Regenerate everything (proto + sqlc + moq mocks) — the single codegen entry point
    cmds:
      - task: proto:generate
      - task: sqlc:generate
      - go generate ./...

  build:
    desc: Build all packages (needs CGO_ENABLED=1 + a C toolchain — see loam-sik)
    cmds:
      - go build ./...

  test:
    desc: Run the test suite with the race detector
    cmds:
      - go test ./... -race

  test:integration:
    desc: >-
      Run the //go:build integration suite (real Postgres via
      testcontainers-go) — needs a Docker (or Docker-API-compatible) daemon.
      On podman, also set TESTCONTAINERS_RYUK_DISABLED=true (see
      internal/db/migrations/integration_test.go); CI's `integration` job
      runs on a real Docker daemon and must NOT set that var.
    cmds:
      - go test -tags=integration ./...

  demo:m1:
    desc: >-
      Demo M1 (loam-ejr): run the store integration suite (loam-li0.6,
      internal/storesuite) live against a real pgvector container, then
      peek at the rows it seeded via psql. Needs the Go toolchain plus a
      docker-CLI-compatible client on PATH talking to a Docker (or
      Docker-API-compatible) daemon -- migrations are applied by the
      suite's own TestMain, no manual DB setup. If your client binary
      isn't named `docker` (e.g. a bare podman install with no docker
      alias), set LOAM_DEMO_DOCKER to its name/path. This target sets
      TESTCONTAINERS_RYUK_DISABLED=true itself, scoped to only its own go
      test invocation -- not exported, and NOT the same as the podman-wide
      workaround `task test:integration` documents -- because
      LOAM_DEMO_KEEP_CONTAINER=1 (below) needs the container to outlive
      this process past ryuk's default ~10s reaping window even on a real
      Docker daemon; see internal/storesuite/main_integration_test.go for
      the full reasoning. Every other integration run (CI's `integration`
      job, `task test:integration`) is unaffected and keeps ryuk enabled.
      Container discipline: the suite's one shared container is created
      under the fixed name loam-demo-m1 when kept alive for the psql peek
      (LOAM_DEMO_KEEP_CONTAINER=1), so this target can remove it by name
      -- once before starting, to self-heal a container leaked by a
      previous Ctrl-C'd run (go-task's mvdan/sh interpreter supports only
      an EXIT trap, and go-task itself intercepts SIGINT without running
      it, so a Ctrl-C during a prior run would otherwise leak silently on
      a podman host with no reaper), and again after finishing, whether
      the suite passed or failed.
    cmds:
      - |
        set -u
        set -o pipefail
        docker_cli="${LOAM_DEMO_DOCKER:-docker}"
        container_name="loam-demo-m1"
        output="$(mktemp)"
        cleanup() {
          echo "=== demo:m1 cleanup: removing container $container_name (if present) ==="
          if ! "$docker_cli" rm -f "$container_name" >/dev/null 2>&1; then
            echo "demo:m1: NOTE -- $container_name was not present to remove (already gone, or never created)" >&2
          fi
          rm -f "$output"
        }
        trap cleanup EXIT
        echo "=== demo:m1 pre-flight: removing $container_name if a previous run leaked it ==="
        "$docker_cli" rm -f "$container_name" >/dev/null 2>&1 || true
        test_status=0
        CGO_ENABLED=1 LOAM_DEMO_KEEP_CONTAINER=1 TESTCONTAINERS_RYUK_DISABLED=true \
          go test -tags=integration -count=1 ./internal/storesuite/... -v 2>&1 | tee "$output" || test_status=$?
        if [ "$test_status" -ne 0 ]; then
          echo "demo:m1: store integration suite failed (exit $test_status) -- see output above" >&2
          exit "$test_status"
        fi
        echo ""
        echo "=== psql peek: seeded rows ($docker_cli exec into $container_name -- no host psql required) ==="
        echo ""
        echo "--- UNIQUE(round_id, reviewer) + derived round staleness (review_rounds/verdicts) ---"
        "$docker_cli" exec "$container_name" psql -U loam -d loam -c "SELECT r.name AS repo, rr.number AS round, v.reviewer, v.outcome, (rr.number = (SELECT max(number) FROM review_rounds WHERE work_branch_id = wb.id)) AS is_current_round FROM verdicts v JOIN review_rounds rr ON rr.id = v.round_id JOIN work_branches wb ON wb.id = rr.work_branch_id JOIN repos r ON r.id = wb.repo_id WHERE r.name = 'group/demo-rounds-repo' ORDER BY rr.number;"
        echo ""
        echo "--- cosine-distance ordering on the seeded vectors (plain ORDER BY <=>; the index-path proof is the EXPLAIN assertion in the suite above) ---"
        "$docker_cli" exec "$container_name" psql -U loam -d loam -c "WITH repo AS (SELECT id FROM repos WHERE name = 'group/demo-hnsw-repo'), origin AS (SELECT embedding FROM chunks, repo WHERE chunks.repo_id = repo.id AND file = 'near.go') SELECT file, ROUND((embedding <=> (SELECT embedding FROM origin))::numeric, 4) AS cosine_distance FROM chunks, repo WHERE chunks.repo_id = repo.id ORDER BY cosine_distance;"
        echo ""
        echo "--- dependents recursive CTE (real WITH RECURSIVE ... CYCLE query, internal/db/queries/code_graph.sql): terminates on the mutual-recursion cycle ---"
        "$docker_cli" exec "$container_name" psql -U loam -d loam -c "WITH RECURSIVE dependents(symbol_id, depth) AS (SELECT ge.from_symbol_id, 1 FROM graph_edges ge WHERE ge.repo_id = (SELECT id FROM repos WHERE name = 'group/demo-cte-repo') AND ge.target_branch = 'main' AND ge.to_symbol_id = (SELECT id FROM symbols WHERE repo_id = (SELECT id FROM repos WHERE name = 'group/demo-cte-repo') AND name = 'is_odd') UNION ALL SELECT ge.from_symbol_id, d.depth + 1 FROM graph_edges ge JOIN dependents d ON ge.to_symbol_id = d.symbol_id WHERE ge.repo_id = (SELECT id FROM repos WHERE name = 'group/demo-cte-repo') AND ge.target_branch = 'main') CYCLE symbol_id SET is_cycle USING visited_path SELECT s.name AS symbol, dependents.depth, dependents.is_cycle FROM dependents JOIN symbols s ON s.id = dependents.symbol_id ORDER BY dependents.depth, s.name;"
        echo ""
        echo "=== demo:m1 complete ==="

  lint:
    desc: Run all lint gates (gofmt + buf lint)
    cmds:
      - |
        fmt_out="$(gofmt -l .)"
        if [ -n "$fmt_out" ]; then
          echo "gofmt found unformatted files:"
          echo "$fmt_out"
          exit 1
        fi
      - go tool buf lint

  proto:lint:
    desc: Lint the protobuf schema
    cmds:
      - go tool buf lint

  proto:format:
    desc: Format the protobuf files in place
    cmds:
      - go tool buf format -w

  proto:generate:
    desc: Generate Go + Connect code into gen/
    cmds:
      - go tool buf generate

  sqlc:generate:
    desc: Generate type-safe Go (pgx/v5) from internal/db/queries/*.sql into internal/db/gen, reading schema straight from internal/db/migrations/files
    cmds:
      - go tool sqlc generate

  # Pre-1.0 breaking-change policy (loam-9yk): pinned to c195909, the merge
  # commit that landed the wave-1 proto reshape, rather than to the moving
  # `main` tip. Run against the pre-reshape parent (28c726d), buf reports 10
  # breaks from that reshape, not 7: GenerateSSHKeyPair (+ its 2
  # request/response messages), SetDescriptionSchema (+ its 2
  # request/response messages), CredentialStatus.has_ssh_key,
  # EnrolledRepo.default_target, EnrolledRepo.has_description_schema, and
  # RequestReviewRequest.comment — all reserved by number (and, except
  # has_ssh_key, by name too) but buf's FILE breaking category still flags
  # FIELD_NO_DELETE / MESSAGE_NO_DELETE / RPC_NO_DELETE regardless of
  # `reserved`, since `reserved` only prevents number/name reuse, it doesn't
  # exempt the deletion itself. Diffing against `--against '.git#branch=main'`
  # would have reported all 10 as breaks the first time this target actually
  # ran (it never had — the target pointed at a nonexistent `master` branch).
  # Rather than either (a) silently accept all future deletions by loosening
  # FILE to a wire-only category, which the has_ssh_key field can't satisfy
  # anyway since it deliberately reserves by number only, or (b) permanently
  # exempt the check, this pins the baseline to the commit *right after* that
  # one deliberate reshape. Every change from here forward is held to full
  # FILE-category compatibility; a future deliberate pre-1.0 break requires
  # bumping this ref in the same commit, with the same rationale treatment.
  proto:breaking:
    desc: Check the schema for breaking changes since the post-reshape baseline (see comment above)
    cmds:
      - go tool buf breaking --against '.git#ref=22d5ed7'
