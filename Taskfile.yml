version: '3'

# Buf and the codegen plugins are pinned in go.mod's `tool` block and run via
# `go tool ...`, so no global installs are needed — only the Go toolchain.

tasks:
  default:
    cmds:
      - task: proto:lint

  tools:
    desc: Download the pinned Go tools (buf, protoc-gen-go, protoc-gen-connect-go, moq)
    cmds:
      - go mod download

  generate:
    desc: Regenerate everything (proto + sqlc + moq mocks) — the single codegen entry point
    cmds:
      - task: proto:generate
      - task: sqlc:generate
      - go generate ./...

  build:
    desc: Build all packages (needs CGO_ENABLED=1 + a C toolchain — see loam-sik)
    cmds:
      - go build ./...

  test:
    desc: Run the test suite with the race detector
    cmds:
      - go test ./... -race

  test:integration:
    desc: >-
      Run the //go:build integration suite (real Postgres via
      testcontainers-go) — needs a Docker (or Docker-API-compatible) daemon.
      On podman, also set TESTCONTAINERS_RYUK_DISABLED=true (see
      internal/db/migrations/integration_test.go); CI's `integration` job
      runs on a real Docker daemon and must NOT set that var.
    cmds:
      - go test -tags=integration ./...

  demo:m1:
    desc: >-
      Demo M1 (loam-ejr): run the store integration suite (loam-li0.6,
      internal/storesuite) live against a real pgvector container, then
      peek at the rows it seeded via psql. Needs only Docker (or a
      Docker-API-compatible daemon) and the Go toolchain -- migrations are
      applied by the suite's own TestMain, no manual DB setup. On podman,
      export TESTCONTAINERS_RYUK_DISABLED=true yourself before running this
      (same podman-only workaround `task test:integration` documents; do
      NOT set it against a real Docker daemon, where ryuk is the reaper
      backstop -- see .github/workflows/ci.yml's `integration` job). This
      target does not export that var itself, so it can never silently
      disable ryuk on a host where ryuk actually works.
      Container discipline: this keeps the suite's one shared container
      alive past the test binary's exit (LOAM_DEMO_KEEP_CONTAINER=1, see
      internal/storesuite/main_integration_test.go) only long enough to
      `docker exec` a psql peek at its seeded rows -- no host psql install
      needed. ryuk is NOT a usable backstop for that kept container on
      podman setups (it runs disabled there), so this target does not rely
      on it: a trap on this script's exit always runs `docker rm -f`
      against the container id the test process printed, whether the
      suite passed, failed, or this script was interrupted.
    cmds:
      - |
        set -u
        output="$(mktemp)"
        cleanup() {
          local id
          id="$(grep -m1 '^LOAM_DEMO_CONTAINER_ID=' "$output" 2>/dev/null | cut -d= -f2)"
          if [ -n "${id:-}" ]; then
            echo "=== demo:m1 cleanup: removing kept container $id ==="
            if ! docker rm -f "$id" >/dev/null 2>&1; then
              echo "demo:m1: WARNING -- could not remove container $id automatically; remove it manually: docker rm -f $id" >&2
            fi
          fi
          rm -f "$output"
        }
        trap cleanup EXIT
        CGO_ENABLED=1 LOAM_DEMO_KEEP_CONTAINER=1 go test -tags=integration -count=1 ./internal/storesuite/... -v > "$output" 2>&1
        test_status=$?
        cat "$output"
        if [ "$test_status" -ne 0 ]; then
          echo "demo:m1: store integration suite failed (exit $test_status) -- see output above" >&2
          exit "$test_status"
        fi
        container_id="$(grep -m1 '^LOAM_DEMO_CONTAINER_ID=' "$output" | cut -d= -f2)"
        if [ -z "$container_id" ]; then
          echo "demo:m1: LOAM_DEMO_CONTAINER_ID not found in test output -- cannot run the psql peek" >&2
          exit 1
        fi
        echo ""
        echo "=== psql peek: seeded rows (docker exec into the kept pgvector container -- no host psql required) ==="
        echo ""
        echo "--- UNIQUE(round_id, reviewer) + derived round staleness (review_rounds/verdicts) ---"
        docker exec "$container_id" psql -U loam -d loam -c "SELECT r.name AS repo, rr.number AS round, v.reviewer, v.outcome, (rr.number = (SELECT max(number) FROM review_rounds WHERE work_branch_id = wb.id)) AS is_current_round FROM verdicts v JOIN review_rounds rr ON rr.id = v.round_id JOIN work_branches wb ON wb.id = rr.work_branch_id JOIN repos r ON r.id = wb.repo_id WHERE r.name = 'group/demo-rounds-repo' ORDER BY rr.number;"
        echo ""
        echo "--- HNSW nearest-neighbour cosine distance on seeded vectors (chunks, distance from near.go) ---"
        docker exec "$container_id" psql -U loam -d loam -c "WITH repo AS (SELECT id FROM repos WHERE name = 'group/demo-hnsw-repo'), origin AS (SELECT embedding FROM chunks, repo WHERE chunks.repo_id = repo.id AND file = 'near.go') SELECT file, ROUND((embedding <=> (SELECT embedding FROM origin))::numeric, 4) AS cosine_distance FROM chunks, repo WHERE chunks.repo_id = repo.id ORDER BY cosine_distance;"
        echo ""
        echo "--- dependents recursive CTE: mutual-recursion cycle edges (graph_edges/symbols) ---"
        docker exec "$container_id" psql -U loam -d loam -c "SELECT s1.name AS from_symbol, s2.name AS to_symbol FROM graph_edges e JOIN symbols s1 ON s1.id = e.from_symbol_id JOIN symbols s2 ON s2.id = e.to_symbol_id JOIN repos r ON r.id = e.repo_id WHERE r.name = 'group/demo-cte-repo' ORDER BY s1.name;"
        echo ""
        echo "=== demo:m1 complete ==="

  lint:
    desc: Run all lint gates (gofmt + buf lint)
    cmds:
      - |
        fmt_out="$(gofmt -l .)"
        if [ -n "$fmt_out" ]; then
          echo "gofmt found unformatted files:"
          echo "$fmt_out"
          exit 1
        fi
      - go tool buf lint

  proto:lint:
    desc: Lint the protobuf schema
    cmds:
      - go tool buf lint

  proto:format:
    desc: Format the protobuf files in place
    cmds:
      - go tool buf format -w

  proto:generate:
    desc: Generate Go + Connect code into gen/
    cmds:
      - go tool buf generate

  sqlc:generate:
    desc: Generate type-safe Go (pgx/v5) from internal/db/queries/*.sql into internal/db/gen, reading schema straight from internal/db/migrations/files
    cmds:
      - go tool sqlc generate

  # Pre-1.0 breaking-change policy (loam-9yk): pinned to c195909, the merge
  # commit that landed the wave-1 proto reshape, rather than to the moving
  # `main` tip. Run against the pre-reshape parent (28c726d), buf reports 10
  # breaks from that reshape, not 7: GenerateSSHKeyPair (+ its 2
  # request/response messages), SetDescriptionSchema (+ its 2
  # request/response messages), CredentialStatus.has_ssh_key,
  # EnrolledRepo.default_target, EnrolledRepo.has_description_schema, and
  # RequestReviewRequest.comment — all reserved by number (and, except
  # has_ssh_key, by name too) but buf's FILE breaking category still flags
  # FIELD_NO_DELETE / MESSAGE_NO_DELETE / RPC_NO_DELETE regardless of
  # `reserved`, since `reserved` only prevents number/name reuse, it doesn't
  # exempt the deletion itself. Diffing against `--against '.git#branch=main'`
  # would have reported all 10 as breaks the first time this target actually
  # ran (it never had — the target pointed at a nonexistent `master` branch).
  # Rather than either (a) silently accept all future deletions by loosening
  # FILE to a wire-only category, which the has_ssh_key field can't satisfy
  # anyway since it deliberately reserves by number only, or (b) permanently
  # exempt the check, this pins the baseline to the commit *right after* that
  # one deliberate reshape. Every change from here forward is held to full
  # FILE-category compatibility; a future deliberate pre-1.0 break requires
  # bumping this ref in the same commit, with the same rationale treatment.
  proto:breaking:
    desc: Check the schema for breaking changes since the post-reshape baseline (see comment above)
    cmds:
      - go tool buf breaking --against '.git#ref=22d5ed7'
