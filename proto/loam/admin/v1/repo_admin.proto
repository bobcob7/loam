syntax = "proto3";

package loam.admin.v1;

import "loam/v1/common.proto";

// Admin-only repo enrollment and management (see docs/web-spec.md). Gated by admin
// basic auth. The admin's repo view is richer than the CLI's read-only
// loam.v1.RepoService.GetRepo.
service RepoAdminService {
  // Enroll by upstream URL; the server derives the "<group>/<repo_name>" identifier,
  // clones the repo, and begins periodic sync + ingest of the indexed branch.
  rpc EnrollRepo(EnrollRepoRequest) returns (EnrollRepoResponse);

  // Enrolled repos with status.
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);

  // One repo with full status.
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);

  // Unenroll and drop the local mirror, graph, and vector data. Guarded: fails with a
  // RemovalBlocked error detail if the repo has non-terminal work branches.
  rpc RemoveRepo(RemoveRepoRequest) returns (RemoveRepoResponse);

  // Replace the branches eligible as work-branch targets and designate which one is
  // indexed. Changing indexed_branch triggers a full ingest of the new branch.
  rpc SetTargetBranches(SetTargetBranchesRequest) returns (SetTargetBranchesResponse);

  // Force a full rebuild of the repo's derived indexes (graph + vectors).
  rpc ReindexRepo(ReindexRepoRequest) returns (ReindexRepoResponse);

  // Recent and active ingest jobs across repos, for the web Jobs view.
  rpc ListIngestJobs(ListIngestJobsRequest) returns (ListIngestJobsResponse);

  // Probe an upstream URL before enrolling: list its branches and current HEAD, so
  // the admin can pick target/indexed branches without enrolling first.
  rpc ProbeRepo(ProbeRepoRequest) returns (ProbeRepoResponse);
}

enum SyncState {
  SYNC_STATE_UNSPECIFIED = 0;
  SYNC_STATE_IDLE = 1;
  SYNC_STATE_SYNCING = 2;
  SYNC_STATE_ERROR = 3;
}

message SyncStatus {
  SyncState state = 1;
  // RFC 3339 timestamp of the last successful sync; empty if never.
  string last_synced_at = 2;
  // Error detail when state is SYNC_STATE_ERROR; empty otherwise.
  string error = 3;
}

message EnrolledRepo {
  // Enrolled repo identifier, "<group>/<repo_name>".
  string repo = 1;
  string upstream_url = 2;
  repeated string target_branches = 3;
  reserved 4;
  reserved "default_target";
  SyncStatus sync = 5;
  reserved 6;
  reserved "has_description_schema";
  // Branch whose content is ingested into the graph/vector indexes; must be one of
  // target_branches.
  string indexed_branch = 7;
  // Commit/ref last ingested for indexed_branch. Empty until the first ingest
  // completes.
  string ingested_ref = 8;
}

message EnrollRepoRequest {
  string upstream_url = 1;
  repeated string target_branches = 2;
  // Branch whose content is ingested into the graph/vector indexes; validated as
  // one of target_branches by the handler.
  string indexed_branch = 3;
}

message EnrollRepoResponse {
  EnrolledRepo repo = 1;
}

message ListReposRequest {
  loam.v1.Page page = 1;
}

message ListReposResponse {
  repeated EnrolledRepo repos = 1;
  loam.v1.PageInfo page_info = 2;
}

message GetRepoRequest {
  string repo = 1;
}

message GetRepoResponse {
  EnrolledRepo repo = 1;
}

message RemoveRepoRequest {
  string repo = 1;
}

message RemoveRepoResponse {}

// Typed error detail attached to a FAILED_PRECONDITION RemoveRepo response when the
// repo has non-terminal (not COMPLETE/CLOSED) work branches (see docs/web-spec.md).
message RemovalBlocked {
  repeated BlockedWorkBranch blockers = 1;
}

// One work branch blocking a RemoveRepo call.
message BlockedWorkBranch {
  string name = 1;
  string title = 2;
  loam.v1.WorkBranchState state = 3;
}

message SetTargetBranchesRequest {
  string repo = 1;
  repeated string target_branches = 2;
  // Branch whose content is ingested into the graph/vector indexes; validated as
  // one of target_branches by the handler.
  string indexed_branch = 3;
}

message SetTargetBranchesResponse {
  EnrolledRepo repo = 1;
}

enum IngestKind {
  INGEST_KIND_UNSPECIFIED = 0;
  INGEST_KIND_INCREMENTAL = 1;
  INGEST_KIND_FULL = 2;
}

enum IngestStatus {
  INGEST_STATUS_UNSPECIFIED = 0;
  INGEST_STATUS_QUEUED = 1;
  INGEST_STATUS_RUNNING = 2;
  INGEST_STATUS_SUCCEEDED = 3;
  INGEST_STATUS_FAILED = 4;
}

// An ingestion job. See docs/ingestion-spec.md.
message IngestJob {
  string repo = 1;
  string target_branch = 2;
  IngestKind kind = 3;
  IngestStatus status = 4;
  uint32 attempts = 5;
  // Error detail when status is FAILED; empty otherwise.
  string error = 6;
  // RFC 3339 timestamps; started/finished empty until they occur.
  string queued_at = 7;
  string started_at = 8;
  string finished_at = 9;
  // ingest_jobs.id (a UUID), the job's stable identity. Empty on a
  // ReindexRepo response (the enqueue path this handler uses is a
  // coalescing no-op/insert that does not report back which row it
  // touched -- internal/ingest.Pool.Enqueue); always populated on
  // ListIngestJobs results, which read the row back from ingest_jobs
  // directly (internal/ingest.JobRecord.ID). Added by loam-1wpa: without
  // this, the web Jobs view had no wire-safe way to key rows uniquely
  // (repo:target_branch:kind:queued_at collides for two jobs of the same
  // repo/branch/kind queued in the same instant).
  string id = 10;
}

message ReindexRepoRequest {
  string repo = 1;
}

message ReindexRepoResponse {
  IngestJob job = 1;
}

message ListIngestJobsRequest {
  loam.v1.Page page = 1;
  // Optional filters.
  optional string repo = 2;
  optional IngestStatus status = 3;
}

message ListIngestJobsResponse {
  repeated IngestJob jobs = 1;
  loam.v1.PageInfo page_info = 2;
}

message ProbeRepoRequest {
  string upstream_url = 1;
}

message ProbeRepoResponse {
  // Branches available on the upstream, for choosing target/indexed branches.
  repeated string branches = 1;
  // Ref currently at HEAD upstream.
  string head = 2;
}
