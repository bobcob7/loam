syntax = "proto3";

package loam.admin.v1;

// Admin-only management of the credentials the server uses to reach each upstream
// forge (see docs/web-spec.md, docs/sync-spec.md). Credentials are keyed by forge
// host and shared by all repos on that host. One token per host covers both the
// REST calls that open upstream PRs and git-over-HTTPS transport to the upstream;
// there is no upstream SSH.
service CredentialService {
  // Set/replace the forge token (Forgejo token / GitHub PAT); the server validates it.
  rpc SetUpstreamToken(SetUpstreamTokenRequest) returns (SetUpstreamTokenResponse);

  // Presence and validation state for one host.
  rpc GetCredentialStatus(GetCredentialStatusRequest) returns (GetCredentialStatusResponse);

  // Presence and validation state across all hosts.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
}

message CredentialStatus {
  // Forge host, e.g. "github.com" or "forgejo.example.com".
  string host = 1;
  bool has_token = 2;
  // Field 3 (formerly the SSH-key presence flag) retired: CredentialService is
  // token-only (see docs/sync-spec.md -> Upstream Transport). Reserved by number
  // only, not name, to keep the retired identifier out of the compiled descriptor.
  reserved 3;
  bool validated = 4;
}

message SetUpstreamTokenRequest {
  string host = 1;
  string token = 2;
}

message SetUpstreamTokenResponse {
  CredentialStatus status = 1;
}

message GetCredentialStatusRequest {
  string host = 1;
}

message GetCredentialStatusResponse {
  CredentialStatus status = 1;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated CredentialStatus statuses = 1;
}
