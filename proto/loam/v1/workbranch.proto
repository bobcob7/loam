syntax = "proto3";

package loam.v1;

import "loam/v1/common.proto";

// Work branches and their review lifecycle. A work branch is the first-party
// entity; "review" is the REVIEWABLE state plus the comment/verdict activity on
// it, not a separate object. Comment staging (`loam work comment`) and `--staged`
// listing happen locally in `.loam`; only SubmitVerdict crosses the wire,
// publishing the staged comments in one atomic action.
service WorkBranchService {
  // Create a work branch server-side from a target branch, without a working
  // copy. The name is randomly generated. Backs `loam work start`.
  rpc CreateWorkBranch(CreateWorkBranchRequest) returns (CreateWorkBranchResponse);

  // Update a work branch's title and/or description at any point.
  rpc UpdateWorkBranch(UpdateWorkBranchRequest) returns (UpdateWorkBranchResponse);

  // Set a work branch reviewable (requires title + description already set).
  // Backs `loam work reviewable`.
  rpc SetReviewable(SetReviewableRequest) returns (SetReviewableResponse);

  // List work branches across all enrolled repos, filtered by the request fields.
  rpc ListWorkBranches(ListWorkBranchesRequest) returns (ListWorkBranchesResponse);

  // Fetch a work branch's metadata (no diff, no threads).
  rpc GetWorkBranch(GetWorkBranchRequest) returns (GetWorkBranchResponse);

  // Fetch a work branch's diff against its target, separately to keep responses small.
  rpc GetWorkBranchDiff(GetWorkBranchDiffRequest) returns (GetWorkBranchDiffResponse);

  // Fetch a work branch's published comment threads.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  // Publish the caller's staged comments atomically as a verdict with an outcome.
  rpc SubmitVerdict(SubmitVerdictRequest) returns (SubmitVerdictResponse);

  // Mark a work branch complete (requires >= 1 approve verdict) and surface it to
  // the admin as a proposed upstream PR.
  rpc CompleteWorkBranch(CompleteWorkBranchRequest) returns (CompleteWorkBranchResponse);
}

message CreateWorkBranchRequest {
  string repo = 1;
  // Target branch to base off; defaults to the repo's default target.
  optional string from = 2;
}

message CreateWorkBranchResponse {
  WorkBranch work_branch = 1;
}

message UpdateWorkBranchRequest {
  string repo = 1;
  string work_branch = 2;
  // Set to update the title; leave unset to keep the current title.
  optional string title = 3;
  // Set to update the description; leave unset to keep the current description.
  optional string description = 4;
}

message UpdateWorkBranchResponse {
  WorkBranch work_branch = 1;
}

message SetReviewableRequest {
  string repo = 1;
  string work_branch = 2;
}

message SetReviewableResponse {
  WorkBranch work_branch = 1;
}

message ListWorkBranchesRequest {
  optional string repo = 1;
  // Filter by author agent identifier.
  optional string author = 2;
  optional string target = 3;
  // Limit to reviewable work branches awaiting the calling agent's verdict.
  bool awaiting_review = 4;
  // Defaults to REVIEWABLE when unset.
  optional WorkBranchState state = 5;
  Page page = 6;
}

message ListWorkBranchesResponse {
  repeated WorkBranch work_branches = 1;
  PageInfo page_info = 2;
}

message GetWorkBranchRequest {
  string repo = 1;
  string work_branch = 2;
}

message GetWorkBranchResponse {
  WorkBranch work_branch = 1;
}

message GetWorkBranchDiffRequest {
  string repo = 1;
  string work_branch = 2;
}

message GetWorkBranchDiffResponse {
  // Unified diff of the work branch against its target.
  string diff = 1;
}

message ListCommentsRequest {
  string repo = 1;
  string work_branch = 2;
  Page page = 3;
}

message ListCommentsResponse {
  repeated Thread threads = 1;
  PageInfo page_info = 2;
}

// A comment being published as part of a verdict.
message VerdictComment {
  oneof target {
    // Start a new thread (optionally line-anchored).
    NewThread new_thread = 1;
    // Reply to an existing thread by id.
    string reply_to_thread_id = 2;
  }
  string body = 3;
}

message NewThread {
  // File/line anchor; unset for a top-level thread.
  optional FileLine anchor = 1;
}

message SubmitVerdictRequest {
  string repo = 1;
  string work_branch = 2;
  VerdictOutcome outcome = 3;
  // The caller's staged comments, published atomically.
  repeated VerdictComment comments = 4;
  // Threads to mark resolved. The server enforces author-only resolution.
  repeated string resolve_thread_ids = 5;
}

message SubmitVerdictResponse {
  VerdictOutcome outcome = 1;
  // Number of comments published.
  uint32 published = 2;
}

message CompleteWorkBranchRequest {
  string repo = 1;
  string work_branch = 2;
}

message CompleteWorkBranchResponse {
  WorkBranch work_branch = 1;
}
