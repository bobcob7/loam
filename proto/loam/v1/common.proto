syntax = "proto3";

package loam.v1;

// Shared messages and enums used across the Loam services.
//
// Agent identity and role are NOT carried in any request message. The CLI sends
// the LOAM_AGENT_* values as request headers and a server interceptor reads them
// into the request context for authorization. Requests therefore only describe
// the operation, never who is asking.

// Scope for queries that can target specific repos or every enrolled repo.
//
// The CLI resolves directory inference locally and populates `repos` with the
// concrete repo(s) chosen: an inferred or `--repo` repo yields one entry, and
// `--all` yields an empty list. An empty list means "all enrolled repos" (the
// fan-out); the CLI only sends empty on explicit `--all`, so an accidental
// empty scope never fans out.
message QueryScope {
  // Enrolled repo identifiers, each "<group>/<name>". Empty = all enrolled repos.
  repeated string repos = 1;
}

// Outcome a reviewer attaches to a submitted verdict.
enum VerdictOutcome {
  VERDICT_OUTCOME_UNSPECIFIED = 0;
  VERDICT_OUTCOME_APPROVE = 1;
  VERDICT_OUTCOME_DISAPPROVE = 2;
  VERDICT_OUTCOME_NEUTRAL = 3;
}

// Lifecycle state of a work branch. Reviewing is a feature of a work branch, not
// a separate object.
enum WorkBranchState {
  WORK_BRANCH_STATE_UNSPECIFIED = 0;
  // Created and being worked on; not yet up for review.
  WORK_BRANCH_STATE_DRAFT = 1;
  // Review requested; awaiting verdicts. Entered from DRAFT, or from REVIEWED for a
  // re-review (which marks the prior round's verdicts stale).
  WORK_BRANCH_STATE_REVIEWABLE = 2;
  // Reviewed this round (received at least one verdict). The admin acts on these:
  // create the upstream PR, request a re-review, or close.
  WORK_BRANCH_STATE_REVIEWED = 3;
  // Terminal: the upstream PR merged. Set by the server on sync, never by an agent.
  WORK_BRANCH_STATE_COMPLETE = 4;
  // Terminal: closed by the admin, or because the upstream PR was closed.
  WORK_BRANCH_STATE_CLOSED = 5;
}

// A work branch — the first-party unit of work. Identity is (repo, name); the
// name is randomly generated and otherwise carries no meaning, so the title and
// description are its human-facing identity. "Review" is the REVIEWABLE state
// plus the comment/verdict activity on it, not a separate resource.
message WorkBranch {
  // Enrolled repo identifier, "<group>/<name>".
  string repo = 1;
  // The randomly generated work branch name; the identifier together with `repo`.
  string name = 2;
  // Target branch the work will eventually merge into upstream.
  string target = 3;
  string title = 4;
  // Full description. Omitted in list summaries.
  string description = 5;
  WorkBranchState state = 6;
  // Agent identifier of the author, "<name>-<id>-<role>".
  string author = 7;
  // Upstream PR URL, once the admin has created it. Unset until then.
  optional string upstream_pr_url = 8;
}

// A single comment within a thread.
message Comment {
  // Agent identifier of the comment's author.
  string author = 1;
  string body = 2;
}

// A location within a file: a file path and an optional line. Shared by comment
// anchors and by the graph's resolved code Location.
message FileLine {
  string file = 1;
  // Absent = the whole file / no specific line.
  optional uint32 line = 2;
}

// A published comment thread on a work branch.
message Thread {
  string id = 1;
  bool resolved = 2;
  // File/line anchor. Unset for a top-level thread.
  optional FileLine anchor = 3;
  repeated Comment comments = 4;
}

// A reviewer's recorded verdict on a work branch. Verdicts persist across rounds;
// requesting review marks the prior round's verdicts `stale`, and only non-stale
// verdicts count toward the approval bar.
message VerdictSummary {
  // Agent identifier of the reviewer.
  string reviewer = 1;
  VerdictOutcome outcome = 2;
  // True once a review has been requested since this verdict was submitted.
  bool stale = 3;
}

// Offset-based pagination for list-returning requests.
message Page {
  // Maximum records to return. 0 means "use the server default"; the server also
  // enforces a hard maximum regardless of the requested value.
  uint32 limit = 1;
  // Number of leading records to skip.
  uint32 offset = 2;
}

// Pagination metadata returned alongside a page of results. With `total`, the
// caller knows more remain when offset + returned-count < total.
message PageInfo {
  // Total records matching the request across all pages.
  uint32 total = 1;
}
