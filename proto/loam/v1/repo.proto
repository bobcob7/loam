syntax = "proto3";

package loam.v1;

// Repo metadata. The git data itself (clone, fetch, push) moves over the git wire
// protocol, not these RPCs; work branch creation lives in WorkBranchService.
service RepoService {
  // Resolve an enrolled repo: its target branches and the default target.
  // Backs the metadata lookup in `loam clone`.
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
}

message GetRepoRequest {
  // Enrolled repo identifier, "<group>/<name>".
  string repo = 1;
}

message GetRepoResponse {
  string repo = 1;
  // Branches eligible as targets for work branches.
  repeated string target_branches = 2;
  // The branch `clone` / `work start` default to when none is specified.
  string default_target_branch = 3;
}
