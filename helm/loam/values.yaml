# Default values for the loam chart. Consumers (e.g. an ArgoCD Application's
# spec.source.helm.valuesObject, following the exact precedent of this
# cluster's argocd/apps/gastown-operator.yaml) override this file, never
# edit it in place.
#
# EVERY KEY IN THIS FILE IS SCHEMA-CHECKED. values.schema.json sits beside
# it, and every object in it DECLARES whether it accepts unknown keys, so a
# key that is not declared there -- a typo, a rename, a value invented
# against a newer chart -- makes `helm template`/`install`/`upgrade` FAIL
# rather than be silently ignored. (Declares, not closes: nodeSelector,
# affinity and the resource blocks are deliberately open, because each is a
# verbatim passthrough of a slice of the Kubernetes API that a partial
# restatement in the schema would reject valid input for. Each says so in
# its own description.) That is not hardening for its own sake: loam-uwus was
# filed because rendering this chart with `--set config.otelEndpoint=...
# --set terminationGracePeriodSeconds=45` produced a ZERO-BYTE diff against
# the default render back when neither key existed and no schema did. A
# plausible-looking wiring would have synced green in ArgoCD, exported
# nothing, and errored nowhere. Adding a values key here means adding it to
# values.schema.json too, and the render fails loudly if you forget.

# -----------------------------------------------------------------------
# replicaCount is enforced to be exactly 1 by templates/_helpers.tpl's
# "loam.validateReplicaCount" guard (invoked from templates/deployment.yaml).
# This is NOT a capacity choice, so do not raise it without first solving
# BOTH of the following, independently:
#   1. persistence below is ReadWriteOnce -- a second pod on a different
#      node cannot mount the data volume at all (storage-layer failure).
#   2. The sync scheduler assumes it is the ONLY process ticking a given
#      repo -- ownership of repos.sync_state is a per-tick invariant
#      (loam-fp7), not merely an optimization. A second replica polling the
#      same table would race it and could double-fetch, or worse,
#      interleave mirror writes.
# See templates/deployment.yaml's own header comment for the fuller
# StatefulSet-vs-Deployment reasoning this chart inherited from
# deploy/k8s/loam-deployment.yaml.
# -----------------------------------------------------------------------
replicaCount: 1

image:
  repository: registry.bobcob7.com/loam/server
  # Pinned to an IMMUTABLE commit-sha manifest list, not :latest, which the
  # build workflow also publishes. :latest would make chart upgrades
  # invisible to ArgoCD/git history -- see docs/deployment-spec.md#rollback.
  # Bumping this is a reviewable diff; rolling back is a git revert.
  tag: dff3598deddb394f1e13bacb92a23ccf23a9b70d
  pullPolicy: IfNotPresent
  # Only needed if the image above is pulled from a private registry
  # (registry.bobcob7.com). Harmless if no such secret exists yet -- the
  # kubelet only consults imagePullSecrets when a pull actually needs
  # credentials; a missing secret only surfaces as ImagePullBackOff on the
  # pod, not a render failure. Set to [] to omit imagePullSecrets entirely.
  pullSecrets:
    - registry-bobcob7-com

namespace:
  # Render a Namespace object as part of this chart's own output, matching
  # deploy/k8s/namespace.yaml's precedent of being self-sufficient under
  # `helm template | kubectl apply` without relying on the consumer's
  # ArgoCD Application also setting syncOptions: [CreateNamespace=true].
  # Applying both is idempotent (server-side apply), so this is safe to
  # leave on even when the Application also sets CreateNamespace=true.
  create: true

# The chart NEVER creates a Secret -- it only references one, by name and
# by individual key, both fully overridable so a consumer can point this at
# an existing Secret with a different name/shape (e.g. a vega-infra
# sealed-secret) without a values-file fork. See templates/deployment.yaml
# and templates/postgres-statefulset.yaml for where each key lands.
secret:
  # Consumer-supplied Secret name, namespace-local (same namespace as this
  # release). Provisioning it (e.g. as a sealed-secret) is out of scope for
  # this chart -- see NOTES.txt for exactly what an operator must create
  # before this release will become ready.
  name: loam-secrets
  keys:
    # -> loam container LOAM_ADMIN_PASSWORD
    adminPassword: LOAM_ADMIN_PASSWORD
    # -> loam container LOAM_DATABASE_URL, full postgres:// DSN, password
    # inline. Only wired up when postgres.enabled is false (external
    # database) -- see postgres.enabled's comment below. When
    # postgres.enabled is true this key is unused: the loam container gets
    # LOAM_DB_HOST/PORT/USER/NAME/SSLMODE from the loam-config ConfigMap
    # and LOAM_DB_PASSWORD from secret.keys.postgresPassword below instead
    # (internal/config's discrete-parts form, loam-ytt2.11), so there is no
    # DSN to keep in sync with postgresPassword by hand.
    databaseUrl: LOAM_DATABASE_URL
    # -> loam container LOAM_ENCRYPTION_KEY. base64-encoded 32-byte AES-GCM
    # key; NOT rotatable in place without re-encrypting every stored forge
    # credential -- see docs/deployment-spec.md's Backup & Restore section.
    encryptionKey: LOAM_ENCRYPTION_KEY
    # -> postgres container POSTGRES_PASSWORD, AND, only when
    # postgres.enabled is true, ALSO -> loam container LOAM_DB_PASSWORD
    # (templates/deployment.yaml). One Secret key feeding both env vars is
    # the fix for loam-ytt2.11: the postgres image only initializes its
    # superuser from POSTGRES_PASSWORD, and pointing both consumers at the
    # same secretKeyRef makes them structurally the same credential --
    # unlike the old two-copies-of-one-password scheme, there is no longer
    # a hand-synced DSN for this to drift from. Only referenced when
    # postgres.enabled is true.
    postgresPassword: POSTGRES_PASSWORD

postgres:
  # false => no in-cluster Postgres: the StatefulSet and its headless
  # Service are both omitted entirely (not merely scaled to zero), and the
  # loam Deployment falls back to the DSN form, getting LOAM_DATABASE_URL
  # from secret.keys.databaseUrl above. This is the form for an externally
  # managed database: moving to one is a one-line values change, not a
  # consumer-side overlay. When you flip this to false, the consumer is
  # responsible for making sure secret.keys.databaseUrl's Secret key
  # already points at that external database -- see NOTES.txt, which warns
  # loudly about this at install/upgrade time.
  #
  # true (the default) => the loam Deployment instead gets the discrete
  # LOAM_DB_* form (internal/config's resolveDatabaseURL, loam-ytt2.11):
  # LOAM_DB_HOST/PORT/USER/NAME/SSLMODE come from the loam-config ConfigMap
  # (templates/configmap.yaml) and LOAM_DB_PASSWORD from
  # secret.keys.postgresPassword above -- the SAME Secret key the postgres
  # StatefulSet reads POSTGRES_PASSWORD from below, so the two credentials
  # cannot drift apart the way two independently-set values could.
  enabled: true
  image: pgvector/pgvector:pg16
  # Pinned, NOT left to the cluster default (`nfs` on vega): Postgres on
  # NFS is a durability and locking hazard, not merely a slow one.
  # vega-infra's own docs addon pins iscsi for its Postgres and Qdrant and
  # uses nfs only for bulk file uploads -- this follows that convention.
  storageClassName: iscsi
  # Starting point only, not a measured figure -- there is no production
  # corpus to size against yet.
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

config:
  adminUser: admin
  # Matches persistence's mount path below AND the image's own Dockerfile
  # ENV default -- keep all three in sync if this ever changes.
  dataDir: /var/lib/loam
  syncInterval: 60s
  prAttribution: true
  # External ollama addon, never deployed by this chart. Confirmed against
  # the live vega cluster (`kubectl get svc -n ollama`, read 2026-07-31):
  # ClusterIP service "ollama" in namespace "ollama" listening on 11434,
  # and its PostSync job already pulls nomic-embed-text -- loam's embedder
  # needs no new infrastructure, just this URL. Do NOT add an ollama
  # Deployment, model-pull Job, or GPU request to this chart -- that is
  # owned elsewhere. (config.go's own default is http://localhost:11434,
  # correct only for a single-process dev run.)
  embedderUrl: http://ollama.ollama.svc.cluster.local:11434
  embedderModel: nomic-embed-text
  ingestWorkers: 2
  logLevel: info
  # POSTGRES_USER / POSTGRES_DB are NOT secret and live here, in the
  # ConfigMap -- not in the Secret. (Corrected in review: an earlier draft
  # of this chart put them in secret.keys alongside the three passwords;
  # they carry no credential material and belong beside the rest of the
  # non-secret config, same as every other LOAM_* default.) Only consumed
  # by the postgres StatefulSet when postgres.enabled is true; ignored
  # entirely against an external database.
  postgresUser: loam
  postgresDb: loam

  # ---- OpenTelemetry (loam-p56y shipped the reader, loam-uwus the wiring)
  #
  # All three are OPTIONAL and default to EMPTY, and empty here means the
  # key is not emitted into the loam-config ConfigMap at all
  # (templates/configmap.yaml wraps each in an `if`). So a release that
  # sets none of them renders byte-for-byte what this chart rendered
  # before these keys existed -- that equivalence is the point, and
  # internal/deploycheck does not check it; `helm template` does.
  #
  # internal/config would tolerate the keys being emitted as empty strings
  # anyway (its lookupDefault/parseFloatEnv treat set-but-empty exactly as
  # unset, internal/config/env.go), so the `if` is about keeping the
  # rendered manifest honest, not about correctness of the loader.

  # LOAM_OTEL_ENDPOINT. The collector's OTLP base URL, and the ONLY enable
  # switch loam has -- there is deliberately no LOAM_OTEL_ENABLED, see
  # internal/config's loadTelemetry for the four-states-three-of-which-
  # mean-off argument. Empty => the process creates no exporter, opens no
  # connection, and starts no telemetry goroutine.
  #
  # Must be an absolute http:// or https:// URL; a bare host:port is
  # REJECTED at startup rather than silently exporting nowhere. The scheme
  # selects TLS. Port 4318, not 4317: loam's exporters are OTLP over HTTP,
  # and 4317 is the gRPC port -- pointing at it yields a collector that
  # accepts the connection and rejects every payload.
  #
  # On the vega cluster the value is cross-namespace (loam runs in `loam`,
  # the collector in `observability`), so it needs the fully-qualified
  # service name:
  #
  #   otelEndpoint: http://otel-gateway.observability.svc.cluster.local:4318
  #
  # That is documentation, not a default. A default endpoint would make
  # every install of this chart start pushing at a host it cannot resolve.
  otelEndpoint: ""
  # LOAM_OTEL_SERVICE_NAME. Empty => internal/config's own default, "loam".
  # Set this only when one collector receives from several loam
  # deployments that need telling apart (e.g. "loam-staging").
  otelServiceName: ""
  # LOAM_OTEL_SAMPLE_RATIO, a float 0..1. Empty => internal/config's own
  # default of 0.1. NOT an off switch at 0: sampling is a trace concept,
  # sdkmetric has no sampler, so 0 silences traces while metrics keep
  # being pushed on their normal interval (docs/server-spec.md). To stop
  # both, clear otelEndpoint above.
  #
  # Quoted-string-or-number: the schema accepts either, because a
  # valuesObject author writing 0.25 and one writing "0.25" both mean the
  # same thing and neither should get a render error.
  otelSampleRatio: ""

persistence:
  # LOAM_DATA_DIR's backing volume. This is NOT a cache: it holds the git
  # mirrors that every enrolled repo's smart-HTTP endpoints serve from
  # directly and that every sync tick fetches into. Pinned, not left to the
  # cluster default (`nfs`): git coordinates through lock files
  # (index.lock, per-ref locks), and NFS's locking/attribute caching make
  # those unreliable -- intermittent corruption, not a clean failure.
  # `iscsi` is block storage and RWO, matching replicaCount's single-writer
  # argument above.
  storageClassName: iscsi
  # Starting point only -- there is no production corpus to size against
  # yet. Expanding later requires a StorageClass with
  # allowVolumeExpansion; shrinking a PVC is not supported by Kubernetes at
  # all, so err small and grow rather than the reverse.
  size: 20Gi

ingress:
  enabled: true
  # Confirmed against the live vega cluster (`kubectl get ingressclass`):
  # `intranet` (controller k8s.io/ingress-nginx-intranet), NOT
  # `ingress-nginx-intranet` -- that longer string names the addon/
  # namespace, not the IngressClass object. Defaults to the cluster's
  # intranet ingress, not the internet-facing one, because nothing calls
  # for external clone/push access; override if that changes.
  className: intranet
  # PLACEHOLDER hostname -- pick the real one when this chart is wired into
  # an ArgoCD Application (loam-ytt2.8) and override via valuesObject.
  host: loam.bobcob7.com
  # loam serves the admin UI/RPC AND git smart-HTTP (/git/*) on the same
  # path prefix "/", and auth for both is handled INSIDE the application
  # (basic auth for admin, agent-identity headers for git) -- this ingress
  # deliberately has no nginx-level auth-basic annotation of its own, which
  # would double up on or conflict with that.
  #
  # The annotations below exist for exactly one reason: git smart-HTTP push
  # of a real repo can be many times larger and slower than a typical HTTP
  # request, and nginx's defaults (1m body size, 60s timeouts) will cut a
  # legitimate push off mid-stream. That failure mode looks like a network
  # flake to whoever hits it, not a config limit -- hence generous values
  # here rather than discovering this the hard way during the first real
  # push.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0" # unlimited
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # git smart-HTTP pushes stream a packfile in the request body; letting
    # nginx buffer the whole thing to disk before forwarding it adds
    # latency and local disk pressure proportional to push size for no
    # benefit here.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

# -----------------------------------------------------------------------
# terminationGracePeriodSeconds -- how long the kubelet waits between
# SIGTERM and SIGKILL. THIS IS A DERIVED NUMBER, NOT A PREFERENCE, and the
# derivation is here so it does not go stale silently the first time a Go
# timeout is tuned. internal/deploycheck's
# TestChartGracePeriodExceedsGoShutdownBudget reads the Go constants below
# out of cmd/server/serve.go and fails if this value stops clearing them,
# so the arithmetic is checked, not merely written down.
#
#   30s  cmd/server/serve.go defaultShutdownGrace -- the shutdownCtx
#        budget. It bounds THREE steps that run inside it, not one:
#        httpServer.Shutdown draining in-flight requests, the policy
#        socket's drain, and the background (sync/ingest) drain. They
#        share the one context, so they are 30s TOTAL, not 30s each.
#  + 5s  cmd/server/serve.go telemetryFlushGrace -- the OTLP flush. This
#        one is ADDITIVE: it deliberately gets its OWN context, because
#        shutdownCtx may already be expired by the time control reaches
#        it, which is exactly the slow shutdown whose traces matter most.
#        It runs STRICTLY AFTER the drains above (see serve.go's comment
#        at the call site for why that order is load-bearing).
#  ----
#   35s  floor -- the sum of the bounded steps, and NOT a safe value.
#        Setting exactly 35 restores precisely the zero margin this whole
#        comment exists to remove: the SIGKILL would race the process
#        exit. (Note the margin was already zero BEFORE telemetry existed
#        -- a 30s drain against Kubernetes' 30s default -- so this is not
#        a cost telemetry introduced. It made an existing zero margin
#        negative.)
#  +10s  margin, sized for ONE step rather than three. db.Close (pgxpool)
#        is serve's top-of-function defer, so it runs strictly AFTER the
#        flush, and it is the only participant in the entire sequence with
#        NO bound of its own: it blocks until every in-flight connection
#        is returned, for as long as that takes. The other unbudgeted
#        steps are real but are milliseconds -- SIGTERM delivery and Go
#        signal handling (the kubelet starts this clock when it SENDS the
#        signal, not when the process observes it), and process teardown
#        after db.Close returns. Worth being precise about, because the
#        day someone asks whether 10s is still enough, the question is
#        about the pool.
#  ====
#   45s  what we set, and what values.schema.json ENFORCES as its minimum.
#        The schema deliberately does not admit the 35s floor: it is the
#        only guard a consumer's own valuesObject passes through, so a
#        floor there would let an override take the value this comment
#        spends ten lines calling unsafe.
#
# Raising this is cheap; the pod only uses the time it needs, because the
# kubelet moves on as soon as the process exits. Lowering it is not a
# tuning knob -- below 35 it silently truncates the drain or the flush,
# and between 35 and 45 it removes the margin above.
# -----------------------------------------------------------------------
terminationGracePeriodSeconds: 45

# Starting point only, not a measured figure -- there is no production
# workload to size against yet. Tune once real usage exists. (This is the
# loam container's own resources; postgres.resources above is separate.)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
