# Non-secret LOAM_* env vars, mirroring the defaulted (non-required) rows of
# internal/config/config.go's table. LOAM_ADMIN_PASSWORD and
# LOAM_ENCRYPTION_KEY are secrets and deliberately do NOT appear here -- see
# templates/deployment.yaml's env block and values.yaml's secret: section.
# The Postgres DSN is split across both: when postgres.enabled is true, its
# non-secret parts (LOAM_DB_HOST/PORT/USER/NAME/SSLMODE) are set below and
# only LOAM_DB_PASSWORD comes from the Secret; when false, the whole DSN
# (LOAM_DATABASE_URL) is a Secret key instead -- see values.yaml's
# postgres.enabled comment for why.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loam-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loam.partOfLabel" . | nindent 4 }}
data:
  LOAM_HTTP_ADDR: ":8080"
  LOAM_ADMIN_USER: {{ .Values.config.adminUser | quote }}
  # Matches persistence.yaml's mount path -- keep these in sync.
  LOAM_DATA_DIR: {{ .Values.config.dataDir | quote }}
  LOAM_SYNC_INTERVAL: {{ .Values.config.syncInterval | quote }}
  LOAM_PR_ATTRIBUTION: {{ .Values.config.prAttribution | quote }}
  LOAM_EMBEDDER_URL: {{ .Values.config.embedderUrl | quote }}
  LOAM_EMBEDDER_MODEL: {{ .Values.config.embedderModel | quote }}
  LOAM_INGEST_WORKERS: {{ .Values.config.ingestWorkers | quote }}
  LOAM_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- /*
  OpenTelemetry (loam-uwus; the fourth key added by loam-wu10, one release
  after internal/config started reading it). Each key is emitted ONLY when
  its value is non-empty, so a release that configures no telemetry renders
  exactly the ConfigMap this chart produced before these keys existed -- no
  empty strings, no new data entries. internal/config would treat an emitted
  empty string as unset anyway (env.go's lookupDefault, parseFloatEnv and
  parseDurationEnv), so this `if` buys a clean manifest rather than
  correctness.
  LOAM_OTEL_ENDPOINT is the only enable switch; with it absent the server
  creates no exporter at all. See values.yaml's config.otel* comments.
  */ -}}
  {{- /*
  `if ne (toString ...) ""` and NOT `with`, uniformly across all four.
  `with` skips its body for ANY falsy value, and for
  config.otelSampleRatio the number 0 is falsy while being a perfectly
  meaningful setting ("silence traces, keep metrics" -- see
  docs/server-spec.md). Under `with`, `otelSampleRatio: 0` would emit
  nothing and internal/config would then apply its 0.1 default: an
  operator's explicit setting silently replaced by a different one,
  which is the exact class of failure loam-uwus was filed for. The other
  three keys would be safe under `with`; they use the same form anyway so
  that nobody "tidies" the odd one out back into the trap.
  */ -}}
  {{- if ne (toString .Values.config.otelEndpoint) "" }}
  LOAM_OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  {{- end }}
  {{- if ne (toString .Values.config.otelServiceName) "" }}
  LOAM_OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  {{- end }}
  {{- if ne (toString .Values.config.otelSampleRatio) "" }}
  LOAM_OTEL_SAMPLE_RATIO: {{ .Values.config.otelSampleRatio | quote }}
  {{- end }}
  {{- if ne (toString .Values.config.otelDbAcquireThreshold) "" }}
  LOAM_OTEL_DB_ACQUIRE_THRESHOLD: {{ .Values.config.otelDbAcquireThreshold | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  # Discrete Postgres DSN parts (internal/config's resolveDatabaseURL,
  # loam-ytt2.11) for the in-cluster postgres StatefulSet
  # (templates/postgres-statefulset.yaml) and its headless Service
  # (templates/postgres-service.yaml, name "postgres"). LOAM_DB_PASSWORD is
  # NOT set here -- it is a Secret key, see templates/deployment.yaml.
  LOAM_DB_HOST: "postgres.{{ .Release.Namespace }}.svc.cluster.local"
  LOAM_DB_PORT: "5432"
  LOAM_DB_USER: {{ .Values.config.postgresUser | quote }}
  LOAM_DB_NAME: {{ .Values.config.postgresDb | quote }}
  # "disable": the in-cluster postgres image below is not configured with
  # any TLS certificate, so there is nothing for a stricter sslmode to
  # negotiate against.
  LOAM_DB_SSLMODE: "disable"
  {{- end }}
