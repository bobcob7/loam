name: CI

# Gate set (docs/bead-workflow.md, "Gates"): gofmt, go build, go vet, go test
# -race, go tool buf lint, plus a generated-code drift check. All of these
# require CGO_ENABLED=1 and a C compiler: internal/parser binds tree-sitter
# grammars via cgo (vendored C sources, statically linked — no external
# tree-sitter system library needed), and `./...` sweeps that package in for
# every command below, including `go vet`. See loam-sik for the empirical
# verification behind this constraint.
#
# Toolchain prerequisites:
#   - linux: gcc or clang + libc headers (`build-essential` on Debian/Ubuntu,
#     the "Development Tools" group on RHEL-likes). ubuntu-latest GitHub
#     runners ship build-essential already; the install step below is a
#     no-op safety net, not a real dependency fetch.
#   - darwin (not run in this workflow, but required for local development):
#     Xcode Command Line Tools (`xcode-select --install`). Apple clang is
#     sufficient — no separate gcc/tree-sitter install needed.
# A missing compiler fails loudly and specifically: `cgo: C compiler "..."
# not found` — if you see that, install the toolchain above, don't disable
# CGO.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"

jobs:
  ci:
    name: gofmt, build, vet, test, buf (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install C toolchain (Linux; macOS runners ship Apple clang already)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must produce no output)
        if: matrix.os == 'ubuntu-latest'
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./... -race
        run: go test ./... -race

      - name: go tool buf lint
        if: matrix.os == 'ubuntu-latest'
        run: go tool buf lint

      - name: Verify generated code has no drift (buf generate + go generate)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool buf generate
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::go tool buf generate / go generate ./... produced a diff — commit the regenerated code (proto in internal/gen, mocks in moq_test.go)."
            git status --porcelain
            git diff
            exit 1
          fi

  integration:
    name: integration tests (real Postgres via testcontainers)
    # Tests behind //go:build integration (starting with loam-54o.3's
    # TestMigrateAgainstRealPostgres) spin up real containers through
    # testcontainers-go against the Docker daemon on the runner, so this
    # needs a Docker-capable host. ubuntu-latest GitHub-hosted runners ship
    # one; macos-latest hosted runners do not, so unlike the `ci` job above
    # this does not run a macOS leg.
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -tags=integration ./...
        # Do NOT set TESTCONTAINERS_RYUK_DISABLED here. That env var is a
        # local-podman-only workaround (podman's Docker-compat API can't
        # resolve ryuk's expected `bridge` network); GitHub-hosted runners
        # have a real Docker daemon, so ryuk (the testcontainers reaper
        # sidecar) works, and disabling it would remove the backstop for
        # exactly the failure modes it exists to catch: SIGKILL, a step
        # timeout, or a -timeout panic, none of which run t.Cleanup. See
        # internal/db/migrations/integration_test.go.
        run: go test -tags=integration ./...

      - name: Sweep leaked testcontainers (ryuk failure backstop)
        # Runs even when the test step above failed or the job was
        # cancelled/timed out: a failed ryuk run leaves the workload
        # container it was about to guard stranded in "created" state,
        # labelled org.testcontainers.reap=true (the ryuk container itself
        # is labelled differently and explicitly excluded from this label,
        # per testcontainers-go's reaper.go), and
        # t.Cleanup(container.Terminate) does not fire on SIGKILL, a step
        # timeout, or a -timeout panic — exactly the cases this sweep
        # covers. That label, and therefore this sweep, only exists when
        # ryuk is enabled: TESTCONTAINERS_RYUK_DISABLED would silently
        # disable both backstops at once, which is one more reason not to
        # set it here (see the step above).
        if: always()
        run: |
          leaked="$(docker ps -aq --filter "label=org.testcontainers.reap=true")"
          if [ -n "$leaked" ]; then
            echo "::warning::Removing containers left behind by a failed ryuk run: $leaked"
            docker rm -f $leaked
          else
            echo "No leaked testcontainers containers found."
          fi
