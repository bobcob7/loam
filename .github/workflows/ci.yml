name: CI

# Gate set (docs/bead-workflow.md, "Gates"; docs/testing-spec.md "CI
# Stages" per-PR row, loam-li0.12): gofmt, go build, go vet, go test -race,
# go tool buf lint, and a generated-code drift check, all in the `ci` job
# below; -tags=integration in `integration`; the godog acceptance suite
# (vs internal/fakeforge) in `acceptance`. Together these three jobs are
# what Taskfile.yml's `task test` describes as the aggregate PR gate --
# go-task itself isn't installed on these runners (see Taskfile.yml's own
# header comment), so each job inlines the bare command `task test` would
# otherwise shell out to, rather than invoking `task` directly. The
# nightly-only suites (provider contract vs a REAL Forgejo, e2e smoke,
# Playwright) are a separate workflow, .github/workflows/nightly.yml, per
# that same CI Stages table's "tens of minutes" budget vs. per-PR's
# "minutes." All of the `ci`/`integration`/`acceptance` jobs' commands
# require CGO_ENABLED=1 and a C compiler: internal/parser binds tree-sitter
# grammars via cgo (vendored C sources, statically linked — no external
# tree-sitter system library needed), and `./...` sweeps that package in for
# every command below, including `go vet`. See loam-sik for the empirical
# verification behind this constraint.
#
# Toolchain prerequisites:
#   - linux: gcc or clang + libc headers (`build-essential` on Debian/Ubuntu,
#     the "Development Tools" group on RHEL-likes). ubuntu-latest GitHub
#     runners ship build-essential already; the install step below is a
#     no-op safety net, not a real dependency fetch.
#   - darwin (not run in this workflow, but required for local development):
#     Xcode Command Line Tools (`xcode-select --install`). Apple clang is
#     sufficient — no separate gcc/tree-sitter install needed.
# A missing compiler fails loudly and specifically: `cgo: C compiler "..."
# not found` — if you see that, install the toolchain above, don't disable
# CGO.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"

jobs:
  ci:
    name: gofmt, build, vet, test, buf (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install C toolchain (Linux; macOS runners ship Apple clang already)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must produce no output)
        if: matrix.os == 'ubuntu-latest'
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./... -race
        run: go test ./... -race

      - name: go tool buf lint
        if: matrix.os == 'ubuntu-latest'
        run: go tool buf lint

      # web/src/gen (TypeScript codegen: protoc-gen-es + connect-query) is
      # covered by the SAME drift check below as internal/gen and
      # moq_test.go, per web/.gitignore's own rationale for committing it.
      # `go tool buf generate --template web/buf.gen.yaml` needs its plugin
      # binaries under web/node_modules/.bin (web/buf.gen.yaml's `local:`
      # entries), so Node + `npm ci` have to run first, on this ubuntu-only
      # leg, before the drift check step below. This does not overlap with
      # the `web` job's own npm ci: that job never touches internal/gen or
      # web/src/gen, and this job never runs `vite build`, so the two never
      # fight over the same output.
      - name: Set up Node (web codegen drift check only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web npm ci (protoc-gen-es / protoc-gen-connect-query plugins for the drift check)
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: npm ci

      - name: Verify generated code has no drift (buf generate + go generate + web codegen)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool buf generate
          go generate ./...
          go tool buf generate --template web/buf.gen.yaml
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generated code drifted from what's committed — commit the regenerated code (Go: internal/gen via 'go tool buf generate', mocks via 'go generate ./...' into moq_test.go; TypeScript: web/src/gen via 'go tool buf generate --template web/buf.gen.yaml')."
            git status --porcelain
            git diff
            exit 1
          fi

      # loam-nvb.16. Everything else that touches the SPA handler builds a
      # synthetic fstest.MapFS; this is the only check that serves the REAL
      # embedded web.Dist(). It must run AFTER the drift check above, because
      # `npm run build` overwrites the committed web/dist placeholders and
      # would otherwise register as generated-code drift.
      #
      # Why it needs a real build at all: the placeholder index.html
      # references no assets, so the test skips (loudly) against it and would
      # otherwise be permanently vacuous in CI. The failure it exists to catch
      # — index.html pointing at asset URLs the server does not serve, from a
      # Vite `base` change or a file `//go:embed all:dist` missed — compiles,
      # embeds, and loads fine, then 404s every asset at runtime.
      #
      # Not `task test:spa` (the Taskfile equivalent): go-task is not
      # installed on these runners, which invoke Go directly throughout.
      - name: Embedded SPA serves its own assets (real Vite build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          trap 'git checkout -- web/dist && git clean -fd web/dist' EXIT
          (cd web && npm run build)
          go test ./internal/server/ -run TestSPA_Embedded -count=1 -v

  web:
    name: web install/typecheck/test/build (${{ matrix.os }})
    # Admin SPA (docs/web-frontend-spec.md, loam-nvb epic): pure Node/npm,
    # no CGO and no Go toolchain involved, so this is a separate job from
    # `ci` above rather than more steps bolted onto it. Runs on both
    # ubuntu-latest and macos-latest, matching `ci`'s own matrix (loam-
    # nvb.15): nothing here is platform-specific, but the vitest/jsdom/vite
    # toolchain is exactly the kind of thing that has surprised this repo
    # before (loam-sik, for the Go side) by behaving differently on macOS,
    # and this job is cheap enough (no containers, no CGO compile) that
    # running it twice is not a real cost. This is the CI job the 182 web
    # tests across 15 files (web/src/**/*.test.ts(x), as of loam-nvb.4
    # through loam-nvb.6) ran nowhere but a developer's own terminal before
    # this bead — every future web bead's tests are enforced from here on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck (tsc --noEmit)
        working-directory: web
        run: npx tsc --noEmit

      # web/tsconfig.json's "include" is deliberately just ["src",
      # "vite.config.ts"], so the step above does NOT cover web/e2e — the
      # Playwright suite is a separate TS project with its own tsconfig
      # (different lib/types: node, and no vitest/globals, whose ambient
      # test/expect would shadow the ones @playwright/test exports). Without
      # this second invocation the entire e2e suite type-checks nowhere and a
      # type error in it ships silently (loam-li0.11.1 noted the gap; this
      # closes it). Type-checking is cheap and needs no browser or stack, so
      # it belongs in the per-PR gate even though RUNNING the e2e suite is a
      # nightly-only stage per docs/testing-spec.md → CI Stages.
      - name: typecheck e2e (tsc -p e2e --noEmit)
        working-directory: web
        run: npx tsc -p e2e --noEmit

      - name: test (vitest run)
        working-directory: web
        run: npm test

      - name: build (vite build)
        # web/dist is committed with placeholders (loam-68os); this step
        # overwrites them with real Vite output on the runner's own
        # checkout, which is fine here -- CI never commits back, so the
        # dirty tree that would matter on a developer's machine is a
        # non-issue in a throwaway CI workspace. This step only proves
        # `npm run build` (tsc --noEmit + vite build) succeeds; it does not
        # feed the Go build in this job, since this job never runs `go
        # build` (see the `ci` job above for that).
        working-directory: web
        run: npm run build

  integration:
    name: integration tests (real Postgres via testcontainers)
    # Tests behind //go:build integration (starting with loam-54o.3's
    # TestMigrateAgainstRealPostgres) spin up real containers through
    # testcontainers-go against the Docker daemon on the runner, so this
    # needs a Docker-capable host. ubuntu-latest GitHub-hosted runners ship
    # one; macos-latest hosted runners do not, so unlike the `ci` job above
    # this does not run a macOS leg.
    #
    # timeout-minutes (loam-li0.12 bead notes, folding in the loam-66a
    # review's hardening item): in practice bounded by Go's default
    # 10-minutes-per-test-binary, but the GitHub Actions job-level default
    # is SIX HOURS, and a hung container wait (e.g. a Docker daemon that
    # never becomes ready) would otherwise burn all of it before failing.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -tags=integration -race -count=1 ./...
        # Do NOT set TESTCONTAINERS_RYUK_DISABLED here. That env var is a
        # local-podman-only workaround (podman's Docker-compat API can't
        # resolve ryuk's expected `bridge` network); GitHub-hosted runners
        # have a real Docker daemon, so ryuk (the testcontainers reaper
        # sidecar) works, and disabling it would remove the backstop for
        # exactly the failure modes it exists to catch: SIGKILL, a step
        # timeout, or a -timeout panic, none of which run t.Cleanup. See
        # internal/db/migrations/integration_test.go.
        #
        # -race (loam-li0.12 bead notes, folding in the loam-66a review's
        # hardening item): this build tag is exactly where the concurrent
        # code lives (loam-c94.1's per-repo serialization, loam-giq.9's
        # state writes), and it's only exercisable against a real database
        # -- a data race reachable only under -tags=integration would go
        # unseen if this job ran without -race while the `ci` job's plain
        # `go test ./... -race` above did not cover it.
        #
        # -count=1 (loam-h3x): the `Set up Go` step above runs with
        # cache: true, and actions/setup-go's cache covers `go env GOCACHE`
        # -- the exact directory Go's test result cache lives in -- keyed
        # on the dependency file hash (go.mod/go.sum), not on a full source
        # diff. Any push/PR that doesn't touch go.mod/go.sum restores that
        # same GOCACHE from a prior run, so this job's cache is warm, NOT
        # cold, whenever dependencies are unchanged -- confirmed against
        # actions/setup-go's own caching ADR, not assumed. Without
        # -count=1, a package whose test inputs (source + testlog-recorded
        # env/file reads) are unchanged since the last run would replay a
        # cached "ok" and skip starting its container, same false-green
        # hole as Taskfile.yml's test:integration (loam-h3x, loam-ejr).
        run: go test -tags=integration -race -count=1 ./...

      - name: Sweep leaked testcontainers (ryuk failure backstop)
        # Runs even when the test step above failed or the job was
        # cancelled/timed out: a failed ryuk run leaves the workload
        # container it was about to guard stranded in "created" state,
        # labelled org.testcontainers.reap=true (the ryuk container itself
        # is labelled differently and explicitly excluded from this label,
        # per testcontainers-go's reaper.go), and
        # t.Cleanup(container.Terminate) does not fire on SIGKILL, a step
        # timeout, or a -timeout panic — exactly the cases this sweep
        # covers. That label, and therefore this sweep, only exists when
        # ryuk is enabled: TESTCONTAINERS_RYUK_DISABLED would silently
        # disable both backstops at once, which is one more reason not to
        # set it here (see the step above).
        if: always()
        run: |
          leaked="$(docker ps -aq --filter "label=org.testcontainers.reap=true")"
          if [ -n "$leaked" ]; then
            echo "::warning::Removing containers left behind by a failed ryuk run: $leaked"
            docker rm -f $leaked
          else
            echo "No leaked testcontainers containers found."
          fi

  acceptance:
    name: acceptance tests (godog, fake forge, real Postgres via testcontainers)
    # docs/testing-spec.md Layer 1 (loam-li0.5) / CI Stages (loam-li0.12):
    # the godog suite against cmd/server's own in-process run() plus the
    # compiled `loam` CLI as a real subprocess per actor, run with
    # internal/fakeforge standing in for the upstream (the real-Forgejo
    # half of the provider contract is a NIGHTLY-only leg -- see
    # .github/workflows/nightly.yml -- not this job). This is the exact
    # command Taskfile.yml's test:acceptance target wraps, and until this
    # job existed the suite ran on no CI runner at all: `task test` in
    # Taskfile.yml documents it as part of the per-PR gate, but go-task
    # itself isn't installed here (see this workflow's other jobs), so
    # this job is what actually enforces it, in parallel with `ci` and
    # `integration` above rather than depending on them -- there is no
    # ordering requirement between the three.
    #
    # Real Postgres via testcontainers-go needs a Docker-capable host,
    # same constraint as `integration` above, so this also does not run a
    # macOS leg.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -tags=acceptance -count=1 ./cmd/server/... -run TestFeatures -v
        # Do NOT set TESTCONTAINERS_RYUK_DISABLED here, same reasoning as
        # the `integration` job above: this runner has a real Docker
        # daemon, so ryuk works, and disabling it would remove the
        # backstop for SIGKILL/timeout/panic cases that skip t.Cleanup.
        #
        # -count=1, same reasoning as `integration` above and
        # Taskfile.yml's own test:acceptance comment: the container/server
        # boot is the thing under test, and Go's test cache can't tell a
        # stale replayed "ok" apart from a genuine rerun.
        #
        # ~@wip is godog's own default tag expression (features/*.feature,
        # docs/testing-spec.md "@wip as bead acceptance criteria") -- no
        # extra flag needed here to exclude still-@wip scenarios.
        run: go test -tags=acceptance -count=1 ./cmd/server/... -run TestFeatures -v

      - name: Sweep leaked testcontainers (ryuk failure backstop)
        if: always()
        run: |
          leaked="$(docker ps -aq --filter "label=org.testcontainers.reap=true")"
          if [ -n "$leaked" ]; then
            echo "::warning::Removing containers left behind by a failed ryuk run: $leaked"
            docker rm -f $leaked
          else
            echo "No leaked testcontainers containers found."
          fi
