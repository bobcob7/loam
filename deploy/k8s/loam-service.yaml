# ClusterIP fronting the loam Deployment's single pod. One Service is
# enough for all of loam's traffic shapes -- admin UI, CLI Connect RPC, and
# git smart-HTTP under /git/* -- because docs/server-spec.md and
# docs/web-spec.md both describe loam as a single HTTP listener that routes
# by path internally; there is no separate git port to expose.
apiVersion: v1
kind: Service
metadata:
  name: loam
spec:
  selector:
    app.kubernetes.io/name: loam
  ports:
    - name: http
      port: 8080
      targetPort: http
