# Kustomize manifest set for loam, deployed via ArgoCD out of
# sudo-core/vega-infra (loam-ytt2.8, not this repo). Flat kustomization.yaml
# with a plain resources: list, no base/overlays split -- matching
# vega-infra's own addons/{cups,docs,fan-control,mailpit,media,
# media-tooling,node-labels} kustomize addons, all of which use this same
# flat shape and let ArgoCD auto-detect it.
#
# SECRET CONTRACT (full detail: loam-ytt2.4). This manifest set references,
# but never creates, generates, or templates, one Kubernetes Secret named
# loam-secrets in the loam namespace, holding six keys (key names match
# the consuming env var name, following the live vega cluster's docs
# addon precedent -- kubectl get statefulset -n docs -o yaml):
#
#   LOAM_ADMIN_PASSWORD -> loam container   (loam-deployment.yaml)
#   LOAM_DATABASE_URL   -> loam container   (loam-deployment.yaml)
#   LOAM_ENCRYPTION_KEY -> loam container   (loam-deployment.yaml)
#   POSTGRES_USER       -> postgres container (postgres-statefulset.yaml)
#   POSTGRES_DB         -> postgres container (postgres-statefulset.yaml)
#   POSTGRES_PASSWORD   -> postgres container (postgres-statefulset.yaml,
#                          must describe the same credential as the
#                          password embedded in LOAM_DATABASE_URL above --
#                          see that manifest's comment)
#
# Provisioning that Secret (e.g. as a vega-infra sealed-secret, per
# seal-secrets.sh's established mechanism) is out of scope for this bead.
# Both the Secret's name and each key are plain literals in the consuming
# manifests, individually overridable from a downstream kustomization with
# a JSON6902 or strategic-merge patch -- see loam-deployment.yaml's env
# block for a worked example. Do not add a Secret resource to this
# `resources:` list, and do not commit a plaintext placeholder Secret
# anywhere in this directory.
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - loam-pvc.yaml
  - loam-deployment.yaml
  - loam-service.yaml
  - loam-ingress.yaml

namespace: loam

labels:
  - pairs:
      app.kubernetes.io/part-of: loam
    includeSelectors: true
