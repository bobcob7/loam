# Headless (clusterIP: None) so the StatefulSet gets the stable per-pod DNS
# name (postgres-0.postgres.loam.svc.cluster.local) a StatefulSet's
# identity guarantees depend on, even though this addon only ever runs one
# replica today. LOAM_DATABASE_URL (in the externally-managed loam-secrets
# Secret) should point at "postgres" (the Service name), which
# load-balances to the single pod either way.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
