# Defaults to the cluster's intranet ingress, not the internet-facing one,
# because nothing in the epic's reconnaissance calls for external
# clone/push access -- flip ingressClassName with a kustomize patch if
# that changes. `ingressClassName: intranet` (not `ingress-nginx-intranet`
# -- that longer string names the addon/namespace, not the IngressClass
# object) is confirmed against the live vega cluster:
#   $ kubectl get ingressclass
#   NAME       CONTROLLER                      PARAMETERS   AGE
#   internet   k8s.io/ingress-nginx-internet   <none>       55d
#   intranet   k8s.io/ingress-nginx-intranet   <none>       55d
#
# loam serves the admin UI/RPC AND git smart-HTTP (`/git/*`) on the same
# path prefix "/" (see docs/web-spec.md's routing table) and auth for both
# is handled INSIDE the application (basic auth for admin, agent-identity
# headers for git) -- this ingress deliberately does not add its own
# nginx-level auth-basic annotation, which would double up on or conflict
# with that.
#
# The annotations below exist for exactly one reason: git smart-HTTP push
# of a real repo can be many times larger and slower than a typical HTTP
# request, and nginx's defaults (1m body size, 60s timeouts) will cut a
# legitimate push off mid-stream. That failure mode looks like a network
# flake to whoever hit it, not a config limit -- hence generous values
# here rather than leaving nginx's defaults in place and discovering this
# the hard way during the first real push.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loam
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0" # unlimited
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # git smart-HTTP pushes stream a packfile in the request body; letting
    # nginx buffer the whole thing to disk before forwarding it adds
    # latency and local disk pressure proportional to push size for no
    # benefit here.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: intranet
  rules:
    # PLACEHOLDER hostname -- pick the real one when this addon is wired
    # into vega-infra (loam-ytt2.8) and override with a kustomize patch.
    - host: loam.bobcob7.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loam
                port:
                  name: http
